<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CALIP - Inventario</title><link rel="stylesheet" href="styles.css?v=2.0.0"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=2.0.0"></script></head><body>
<header class="topbar"><div><h1>CALIP</h1><span>Inventario</span></div><div id="status">Conectando...</div></header>
<main class="main-content">
<section class="inventory-card"><h2>Conteo de inventario</h2><input id="invSearch" type="search" placeholder="Buscar por código o descripción..."><div id="results" class="results"></div><div id="selectedProduct" class="selected-product">Selecciona un producto.</div>
<div class="form-grid"><div><label>Cantidad</label><input id="invQty" type="number" min="0" step="1"></div><div><label>Cajas</label><input id="invCajas" type="number" min="0" step="1" value="0"></div><div><label>Unidades</label><input id="invUnidades" type="number" min="0" step="1" value="0"></div><div><label>Vencimiento</label><input id="invVencimiento" type="date"></div></div>
<button id="saveCount" class="primary-btn">GUARDAR CONTEO</button><p id="inventoryMsg" class="message"></p></section>
<section class="inventory-card"><div class="page-header"><h2>Conteos registrados</h2><button id="reload" class="secondary-btn">Actualizar</button></div><div class="table-container"><table><thead><tr><th>Código</th><th>Producto</th><th>Línea</th><th>Vencimiento</th><th>Stock</th><th>Conteo</th><th>Diferencia</th><th>Cajas</th><th>Unidades</th><th>Fecha</th></tr></thead><tbody id="inventoryBody"></tbody></table></div></section>
</main><script src="app.js?v=2.0.0"></script></body></html>
